[package]
name = "kaviri-render-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Leases render jobs from the kaviri-cloud queue, films them in a throwaway container, uploads the MP4."
license = "FSL-1.1-Apache-2.0"
publish = false

[dependencies]
# One async runtime, because the worker is three concurrent things at once for the whole
# life of a job: a child process to supervise, a heartbeat on a timer, and a stdout stream
# to read. Threads and channels would do it, but not more clearly.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
# rustls rather than the system OpenSSL, so the container and the host box do not have to
# agree about a shared library in order for the worker to reach Supabase.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[profile.release]
# A render box is not short of disk, and a panic backtrace from a worker that dropped a
# customer's take is worth more than the binary size it costs.
debug = 1
